apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse-integration
spec:
  # NodePort so the routesim container (docker, on the `kind` network) can dial
  # the native protocol via <kind-node>:30900. In-cluster clients keep using the
  # ClusterIP DNS name clickhouse:9000.
  type: NodePort
  selector:
    app.kubernetes.io/name: clickhouse-integration
  ports:
    - name: native
      port: 9000
      targetPort: native
      nodePort: 30900
      protocol: TCP
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
