# Opens the built-in `default` user (no password) to the whole pod network so
# the exporter Pod can connect over the cluster Service. Test-only; do not use
# such an open profile in production. Content is authored here (NOT imported
# from the poc/ testdata).
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-open-users
  labels:
    app.kubernetes.io/name: metadata-exporter-integration
data:
  open-networks.xml: |
    <clickhouse>
      <users>
        <default>
          <password></password>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
        </default>
      </users>
    </clickhouse>
  lightweight-update.xml: |
    <clickhouse>
      <profiles>
        <default>
          <enable_lightweight_update>1</enable_lightweight_update>
          <allow_experimental_lightweight_update>1</allow_experimental_lightweight_update>
        </default>
      </profiles>
    </clickhouse>
